<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 🧸✨</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --cherry: #D2042D;
            --pink-light: #FFB6C1;
            --bg-pink: #ffdde1;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: var(--bg-pink);
            /* Heart Pattern Background */
            background-image: radial-gradient(#ffffff 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .card {
            background-color: var(--cherry); 
            padding: 40px;
            border-radius: 40px;
            border: 8px solid #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            width: 320px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: var(--pink-light); 
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            position: relative;
            min-height: 140px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: 800;
            border: none;
            border-radius: 50px; 
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        #yesBtn {
            background: #FFB6C1;
            color: var(--cherry);
            box-shadow: 0 8px 0px #b08289;
            animation: pulse 1.5s infinite;
        }

        #yesBtn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0px #b08289;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        #noBtn {
            background: #fff;
            color: var(--cherry);
            position: absolute;
            z-index: 999;
            box-shadow: 0 8px 0px #cccccc;
        }

        /* Success Message Styling */
        .success-content {
            display: none;
            color: white;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cat-gif {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="askSection">
            <h1 id="question">WILL YOU BE MY VALENTINE? 🧸✨</h1>
            <div class="buttons">
                <button id="yesBtn">YES! 😍</button>
                <button id="noBtn">NO 😤</button>
            </div>
        </div>

        <div id="successSection" class="success-content">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXNidXN4Z3J0eHh3eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PUExJmU9Ym9vaw/3oriO0OEd9QIDdllqo/giphy.gif" alt="Happy Cat" class="cat-gif">
            <h2>YAY! Best. Day. Ever! ❤️</h2>
            <p>I'll see you on the 14th!</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const askSection = document.getElementById('askSection');
        const successSection = document.getElementById('successSection');

        // Logic to move the button
        const moveButton = () => {
            const maxX = window.innerWidth - noBtn.offsetWidth - 30;
            const maxY = window.innerHeight - noBtn.offsetHeight - 30;
            
            // Randomize position
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        };

        // Triggers for Desktop & Mobile
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Stops the "click" from happening on phones
            moveButton();
        });

        // If they actually click NO (very rare), show a funny alert
        noBtn.addEventListener('click', () => {
            alert("Error 404: 'No' option not found. Please try 'Yes' instead! 😉");
        });

        // Success Logic
        yesBtn.addEventListener('click', () => {
            askSection.style.display = 'none';
            successSection.style.display = 'block';

            // Continuous Confetti Celebration
            var end = Date.now() + (10 * 1000);
            var colors = ['#D2042D', '#FFB6C1', '#ffffff'];

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>
</html>
